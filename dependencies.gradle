dependencies {
    compileOnly(libs.jetbrains.annotations)

    implementation group: 'javax.annotation', name: 'javax.annotation-api', version: '1.3.2'

    implementation("org.lwjgl:lwjgl:3.3.2")
    implementation("org.lwjgl:lwjgl-opengl:3.3.2")

    compileOnly('org.projectlombok:lombok:1.18.42')
    annotationProcessor('org.projectlombok:lombok:1.18.42')

    implementation("com.gto.fastcollection:FastCollection:26.8.7")
    implementation("com.gto.recipesearch:RecipeSearch:26.8.4")
    // Taffy：与 LDLib2 相同的布局引擎，新�?UI 框架（uipro）用；发行版�?jarJar 内嵌
    jarJar(implementation("dev.vfyjxf:taffy:1.1.4"))
    // �?mod 的库在开发运行时要进游戏 classpath（对�?LDLib2 �?libraries 配置），否则 GAME 层找不到�?
    additionalRuntimeClasspath("dev.vfyjxf:taffy:1.1.4")
    modImplementation("com.gto:datasynclib-forge-1.20.1:26.10.11")
    modImplementation("com.gto:gtoutils-forge-1.20.1:26.10.3")
    modImplementation("com.gto:gtorenders-forge-1.20.1:26.10.1")
    modCompileOnly("curse.maven:tool-belt-260262:5929061")

    modImplementation("org.appliedenergistics:guideme:20.1.13")
    modImplementation("curse.maven:duplicationless-1380105:8646420")

    modRuntimeOnly("curse.maven:spark-361579:4738952")
    modRuntimeOnly("curse.maven:modernfix-790626:7928686")
    modRuntimeOnly("dev:jecharacters:1.20.1-forge-4.5.11-dev-shadow")

    modCompileOnly("mezz.jei:jei-1.20.1-forge-api:15.59.0.211")
    modCompileOnly("mezz.jei:jei-1.20.1-common-api:15.59.0.211")
    modImplementation("mezz.jei:jei-1.20.1-forge:15.59.0.211")

    // LDLib
    modApi(forge.ldlib.get())

    // Configuration
    modApi(forge.configuration.get())

    // Mixin (& Extras)
    annotationProcessor(variantOf(libs.mixin) { classifier("processor") })
    compileOnly(annotationProcessor(forge.mixinExtras.common.get()))
    api(forge.mixinExtras.forge.get()).version {
        require("[${forge.versions.mixinExtras.get()},)")
    }

    // Recipe Viewers
    modCompileOnly(forge.emi)

    // WAILA-likes
    modCompileOnly(forge.jade)

    // Curios
    modCompileOnly(variantOf(forge.curios) { classifier("api") })

    // AE2
    modCompileOnly(forge.ae2)
    modCompileOnly(forge.ae2wtlib)

    // Shimmer
    modCompileOnly(forge.shimmer)
    modCompileOnly(forge.embeddium)

    // Teams
    modCompileOnly(forge.ftblibrary)
    modCompileOnly(forge.ftbteams)
    modCompileOnly(forge.ftbquests)

    // Maps
    modCompileOnly(forge.xaeroslib)
    modCompileOnly(forge.xaerosminimap)
    modCompileOnly(forge.xaerosworldmap)

    // Standard runtime mods //
    modRuntimeOnly(forge.jade)
    modRuntimeOnly(forge.ae2)

    // Runtime Recipe Viewers - uncomment whichever one you want to use //
    modRuntimeOnly(forge.emi)

}
